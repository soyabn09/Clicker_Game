name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.0"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2

      - name: Install Windows dependencies
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-go
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          go install github.com/tc-hib/go-winres@latest

      - name: Build Windows GUI
        shell: msys2 {0}
        run: |
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          VERSION="${GITHUB_REF_NAME#v}"
          go-winres make --product-version "$VERSION"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags static -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'main.appVersion=${{ github.ref_name }}'" -o "ClickerGame-${{ github.ref_name }}-windows.exe" .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: clicker-game-windows
          path: ClickerGame-${{ github.ref_name }}-windows.exe

